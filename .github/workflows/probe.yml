name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build --stacktrace -q || true
      - name: dump APIs
        run: |
          set +e
          mkdir -p /tmp/out
          J=$(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -E 'minecraft-(merged|client|clientOnly)|minecraft.*26\.2' | head -20)
          echo "$J" > /tmp/out/mcjars.txt
          F=$(find ~/.gradle .gradle -name 'fabric-*.jar' 2>/dev/null | grep -v sources)
          CP=$(echo $J $F | tr ' ' ':')
          for jar in $F; do unzip -l "$jar" 2>/dev/null | awk '{print $4}' | grep -E 'KeyMapping|KeyBinding|HudElement|HudLayer|ClientReceiveMessage|HudRender' | sed "s#^#$jar :: #"; done > /tmp/out/fabric_classes.txt
          for c in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' com.mojang.blaze3d.platform.InputConstants net.minecraft.resources.Identifier net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.DeltaTracker net.minecraft.client.gui.Font; do
            echo "=== $c" >> /tmp/out/javap.txt; javap -cp "$CP" -public "$c" >> /tmp/out/javap.txt 2>&1
          done
          for c in $(grep -oE '[a-z/]+(KeyMapping|KeyBinding|HudElement|ClientReceiveMessage)[A-Za-z$]*\.class' /tmp/out/fabric_classes.txt | sed 's#\.class##; s#/#.#g' | sort -u); do
            echo "=== $c" >> /tmp/out/javap.txt; javap -cp "$CP" -public "$c" >> /tmp/out/javap.txt 2>&1
          done
          cd /tmp/out && git init -q -b probe-out && git config user.name a && git config user.email a@a && git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" probe-out
