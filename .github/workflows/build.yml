name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - name: api dump (debug)
        if: always()
        run: |
          jar=/home/runner/.gradle/caches/fabric-loom/26.2/minecraft-client.jar
          javap -p -cp $jar net.minecraft.client.Minecraft | grep -i hud || true
          javap -p -cp $jar net.minecraft.client.gui.Gui | grep -i hud || true
          javap -cp $jar net.minecraft.client.gui.components.ChatComponent | grep -i "addMessage\|addClientSystemMessage" || true
      - uses: actions/upload-artifact@v7
        with:
          name: engine-notify
          path: build/libs/*.jar
