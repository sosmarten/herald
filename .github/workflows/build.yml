name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - name: api dump (debug)
        if: always()
        run: |
          jar=/home/runner/.gradle/caches/fabric-loom/26.2/minecraft-client.jar
          for c in net.minecraft.network.chat.ClickEvent 'net.minecraft.network.chat.ClickEvent$RunCommand' 'net.minecraft.network.chat.ClickEvent$CopyToClipboard' 'net.minecraft.network.chat.ClickEvent$SuggestCommand' net.minecraft.client.KeyboardHandler net.minecraft.client.multiplayer.ClientPacketListener; do echo "== $c"; javap -cp $jar "$c" 2>&1 | grep -iE "class|record|Clipboard|Unattended|sendCommand|RunCommand|public .*\(java.lang.String" | head -20; done
          echo "== Minecraft keyboard"; javap -cp $jar net.minecraft.client.Minecraft | grep -i "keyboard" || true
          echo "== Screen click"; javap -p -cp $jar net.minecraft.client.gui.screens.Screen | grep -iE "click|command" | head -20
      - uses: actions/upload-artifact@v7
        with:
          name: engine-notify
          path: build/libs/*.jar
      # the built jar also goes to the "dist" branch, so Claude can fetch it with plain git
      - name: publish to dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/dist && cp build/libs/*.jar /tmp/dist/ && cd /tmp/dist
          git init -q -b dist && git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "Built from ${GITHUB_SHA} at $(date -u +%FT%TZ)" > BUILD.txt
          git add -A && git commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist
