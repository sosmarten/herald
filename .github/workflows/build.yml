name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - name: api dump (debug)
        if: always()
        run: |
          jar=/home/runner/.gradle/caches/fabric-loom/26.2/minecraft-client.jar
          javap -p -cp $jar net.minecraft.client.gui.Gui | grep -i chat || true
          javap -cp $jar net.minecraft.client.multiplayer.chat.ChatListener | head -40 || true
          for c in $(unzip -Z1 $jar | grep -E '^net/minecraft/client/(gui/[A-Za-z]+|gui/hud/[A-Za-z]+|Minecraft)\.class$' | sed 's/\.class$//; s#/#.#g'); do javap -cp $jar $c 2>/dev/null | grep -E "ChatComponent [a-zA-Z]+\(\)" | sed "s#^#$c: #"; done
      - uses: actions/upload-artifact@v7
        with:
          name: engine-notify
          path: build/libs/*.jar
